<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming | Player Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="#players"><span>&#127918;</span> GAMING</a>
    <div class="status"><i></i> Player Manager</div>
  </header>

  <main>
    <section id="players" class="workspace">
      <div class="panel">
        <p class="eyebrow">ADD PLAYER</p>
        <h2 id="formTitle">New player</h2>
        <form id="playerForm">
          <input type="hidden" id="editingId" />
          <label>Player ID<input id="playerId" maxlength="24" placeholder="P001" required /></label>
          <label>Username<input id="username" maxlength="40" placeholder="GamerX" required /></label>
          <div class="two-col">
            <label>Level<input id="level" type="number" min="1" placeholder="15" required /></label>
            <label>High score<input id="highScore" type="number" min="0" placeholder="9800" required /></label>
          </div>
          <label>Achievements <small>Separate with commas</small><input id="achievements" placeholder="First Win, Level Master" /></label>
          <div class="form-actions"><button class="primary" type="submit" id="submitButton">Save player &rarr;</button><button type="button" class="text-button hidden" id="cancelEdit">Cancel</button></div>
        </form>
      </div>

      <div class="panel">
        <p class="eyebrow">SEARCH PLAYER</p>
        <h2>Find a player</h2>
        <div class="search"><input id="searchId" placeholder="Enter player ID (example: P001)" /><button id="searchButton" aria-label="Search player">S</button></div>
        <div id="profileEmpty" class="empty-state">Search for a player to view their profile.</div>
        <article id="playerCard" class="player-card hidden"></article>
      </div>
    </section>

    <section id="leaderboard" class="leaderboard-section">
      <div class="section-heading">
        <div><p class="eyebrow">LEADERBOARD</p><h2>Top players &#127942;</h2></div>
        <button id="refreshLeaderboard" class="outline-button">Refresh</button>
      </div>
      <div class="stats"><span><b id="playerCount">-</b> Players</span><span><b id="topScore">-</b> Top score</span></div>
      <div id="leaderboardList" class="leaderboard-list"><p class="empty-state">Loading players...</p></div>
    </section>
  </main>

  <footer>GAMING <span>Player Profile Management System</span></footer>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
